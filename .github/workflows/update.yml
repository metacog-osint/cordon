name: update
# Hourly: collect every source, commit data/ when its content changed, build site/, log what changed in data/history/
# (new, changed and ended items, kept after they leave the feed) and publish site/ to GitHub Pages
# (https://cordon.theintelligence.company/). A failing source keeps its last good data; nothing here fails the run
# except a broken build. Free: public repo, no secrets.
#
# GitHub delays and drops scheduled runs under load: from 1 to 4 Nov 2026 a single hourly trigger ran about once every
# six hours. So the schedule fires four times an hour and the gate job skips the run when the site was deployed less
# than 45 minutes ago (a skipped run deploys nothing, so it can't hold the next one back).
on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      deployments: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at // empty' || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2700 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "Site deployed at $last, under 45 minutes ago: skipping this run."
          else
            echo "Last deployment: ${last:-none found}. Running."
          fi
  update:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect
        run: python tools/cordon.py collect
      - name: Commit data when its content changed
        run: |
          if [ -n "$(git status --porcelain -- data ':!data/health.json')" ]; then
            git config user.name "cordon-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # GitHub sometimes refuses a push (Elements saw an error 500 on 4 Nov 2026). Retry; if it still fails, carry
            # on so this run's data is still built and deployed, and the next run commits it.
            pushed=no
            for i in 1 2 3; do
              if git push -q origin HEAD:main; then pushed=yes; break; fi
              echo "::warning::data push attempt $i failed"
              sleep $((i * 15)); git pull -q --rebase origin main || true
            done
            [ "$pushed" = yes ] || echo "::warning::data not committed this run; the site is still deployed"
          else
            echo "no content change"
          fi
      - name: Open a review issue for each new embassy-status change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/cordon.py reviews reviews
          [ -n "$(ls reviews)" ] || exit 0
          gh label create cordon-review --color 5B3FA8 --description "Embassy status read from advisory text: check it" 2>/dev/null || true
          gh issue list --state all --label cordon-review --limit 500 --json title --jq '.[].title' > existing.txt
          for f in reviews/*.md; do
            title=$(head -n 1 "$f")
            if ! grep -Fxq "$title" existing.txt; then
              tail -n +2 "$f" > body.md
              gh issue create --title "$title" --label cordon-review --body-file body.md
            fi
          done
      - name: Build site
        run: python tools/cordon.py build
      # History: what is new, changed or ended since the last run, kept after it leaves the feed (the doctrine kit's
      # tic-history/1, doctrine/kit/docs/history-log.md). The feed's own health block says which sources were read, so a
      # failed source, or a stale one whose items are withheld, ends nothing; embassy posts read as us-embassy-alerts.
      # Kept in data/history/ (data/** never starts a run) and committed; the items that ended in the last 7 days are
      # served at /data/ended.geojson. A failure here is a gap in the history, never a missed deploy.
      - name: History (data/history/, and site/data/ended.geojson)
        run: |
          python doctrine/kit/tic.py history site/data/feed.geojson --dir data/history --ended site/data/ended.geojson             --lane-map "usembassy-*=us-embassy-alerts"             || { echo "::warning::history step failed; this run is missing from data/history/"; exit 0; }
          [ -n "$(git status --porcelain -- data/history)" ] || exit 0
          git config user.name "cordon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git commit -q -m "history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15)); git pull -q --rebase origin main || true
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
