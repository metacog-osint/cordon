name: update
# Hourly: collect every source, commit data/ when its content changed, build site/, log what changed in data/history/
# (new, changed and ended items, kept after they leave the feed) and publish site/ to GitHub Pages
# (https://cordon.theintelligence.company/). A failing source keeps its last good data; nothing here fails the run
# except a broken build. Free: public repo. Secrets: NMS_CLIENT_ID and NMS_CLIENT_SECRET (FAA NMS-API, set by hand),
# TIC_ARCHIVE_TOKEN (the private archive below).
#
# Private archive (the step after the deploy): the NMS archive's closed days, data/, data/history/ and the deployed
# site/ also go to the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is replaced or
# deleted. The public copies are replaced every run (data/, site/, today's NMS day asset) or kept only for a while
# (the Actions cache, the unpushed-data artifact); the archive keeps every version. Nothing here reads the archive
# back: a lost cache is still rebuilt from the public release and the published files.
#
# GitHub delays and drops scheduled runs under load: from 1 to 4 Nov 2026 a single hourly trigger ran about once every
# six hours. So the schedule fires four times an hour and the gate job skips the run when the site was deployed less
# than 45 minutes ago (a skipped run deploys nothing, so it can't hold the next one back).
on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      deployments: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at // empty' || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2700 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "Site deployed at $last, under 45 minutes ago: skipping this run."
          else
            echo "Last deployment: ${last:-none found}. Running."
          fi
  update:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # FAA NMS-API store (cordon/nms.py): the NOTAMs the subsets keep, in the private Actions cache, never committed.
      # Each run restores the newest copy and saves its own; a lost cache is rebuilt from the published files.
      # cache/nms/archive/ is the working copy of the permanent archive (cordon/nmsarchive.py): every NMS feature of
      # every pull, kept for good as release assets (nms-archive-YYYY-MM); the cache only speeds it up.
      - name: Restore the NMS store
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/nms/store.json.gz
            cache/nms/archive
          key: nms-store-${{ github.run_id }}
          restore-keys: nms-store-
      - name: Collect
        id: collect
        env:
          # FAA NMS-API keys (production), set by hand; without them the nms lane waits and makes no request.
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
          NMS_ENV: ${{ vars.NMS_ENV || 'prod' }}
          # the workflow's own token (contents: write): uploads the NMS archive's day assets to this repo's releases
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/cordon.py collect
      - name: Save the NMS store
        if: always() && (hashFiles('cache/nms/store.json.gz') != '' || hashFiles('cache/nms/archive/meta.json') != '')
        uses: actions/cache/save@v4
        with:
          path: |
            cache/nms/store.json.gz
            cache/nms/archive
          key: nms-store-${{ github.run_id }}
      - name: Commit data when its content changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain -- data ':!data/health.json' ':!data/nms_state.json')" ]; then
            git config user.name "cordon-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # GitHub sometimes refuses a push (Elements saw an error 500 on 4 Nov 2026). Retry; if it still fails, keep
            # going so the site is still deployed, upload data/ (history included) as an artifact after the history
            # step, and fail the run at the end, so nothing this run collected is discarded unseen.
            pushed=no
            for i in 1 2 3; do
              if git push -q origin HEAD:main; then pushed=yes; break; fi
              echo "::warning::data push attempt $i failed"
              sleep $((i * 15)); git pull -q --rebase origin main || true
            done
            if [ "$pushed" != yes ]; then
              echo "::error::data not committed this run (all pushes failed); data/ is uploaded as an artifact"
              echo "unpushed=yes" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "no content change"
          fi
      - name: Open a review issue for each new embassy-status change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/cordon.py reviews reviews
          [ -n "$(ls reviews)" ] || exit 0
          gh label create cordon-review --color 5B3FA8 --description "Embassy status read from advisory text: check it" 2>/dev/null || true
          gh issue list --state all --label cordon-review --limit 500 --json title --jq '.[].title' > existing.txt
          for f in reviews/*.md; do
            title=$(head -n 1 "$f")
            if ! grep -Fxq "$title" existing.txt; then
              tail -n +2 "$f" > body.md
              gh issue create --title "$title" --label cordon-review --body-file body.md
            fi
          done
      - name: Build site
        run: python tools/cordon.py build
      # History: what is new, changed or ended since the last run, kept after it leaves the feed (the doctrine kit's
      # tic-history/1, doctrine/kit/docs/history-log.md). The feed's own health block says which sources were read, so a
      # failed source, or a stale one whose items are withheld, ends nothing; embassy posts read as us-embassy-alerts.
      # Kept in data/history/ (data/** never starts a run) and committed; the items that ended in the last 7 days are
      # served at /data/ended.geojson. --fill-last-change writes last_change (feed revision 2.1) into the feed on items
      # that do not state it, from the log's record, and rewrites site/data/feed.geojson (compact) before the deploy.
      # A failure here never stops the deploy; the run fails at the end instead, so the gap is seen.
      - name: History (data/history/, and site/data/ended.geojson)
        id: history
        run: |
          # The run's time is the feed's own build time, so no change is logged after the items' published_at.
          built=$(python -c "import json; print(json.load(open('site/data/feed.geojson', encoding='utf-8'))['generated_at'])")
          python doctrine/kit/tic.py history site/data/feed.geojson --now "$built" --dir data/history --ended site/data/ended.geojson             --lane-map "usembassy-*=us-embassy-alerts" --fill-last-change             || { echo "::error::history step failed; this run is missing from data/history/"; echo "failed=yes" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "$(git status --porcelain -- data/history)" ] || exit 0
          git config user.name "cordon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git commit -q -m "history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15)); git pull -q --rebase origin main || true
          done
          echo "::error::history not committed this run (all pushes failed); data/ is uploaded as an artifact"
          echo "unpushed=yes" >> "$GITHUB_OUTPUT"
      - name: Keep this run's data and history when a push failed
        if: steps.commit.outputs.unpushed == 'yes' || steps.history.outputs.unpushed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-data-${{ github.run_id }}
          path: data
          retention-days: 30
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      # Pages sometimes lists no artifact just after the upload has finished ("Found 0 artifact(s)": 5 of 100 runs,
      # 13-15 Nov 2026, each with the artifact finalized under an ID half a second earlier), and the site then waits a
      # run for its refresh. So a failed deploy is tried once more after a pause; the run fails only if both do.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before deploying again
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::first Pages deploy failed; trying once more in 20 s"
          sleep 20
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # What this public repository replaces, or keeps only for a while, to the private archive, one lane each
      # (release cordon-<lane>-YYYY-MM; a snapshot per run, only changed files uploaded, nothing replaced or deleted):
      #   nms      cache/nms/archive/days/: the NMS archive's closed UTC days (cordon/nmsarchive.py), byte for byte
      #            the day assets of release nms-archive-YYYY-MM. Today's file is left out: it is rebuilt during the
      #            day, each copy holding every record of the one before (a union), so the closed day holds them all;
      #            it goes up with the first run after midnight UTC. A closed day leaves the cache after 3 days and
      #            stays restorable from the snapshots that held it. The dedupe index (seen.json.gz), the significance
      #            chains and the NMS store are working state built from these records, so they are not archived.
      #   data     data/ without history/: each source's last good copy, and health.json and nms_state.json, which
      #            are committed only beside another change. Only once collect finished.
      #   history  data/history/ as the History step left it (the log, state.json, dropped.jsonl). Only when that
      #            step logged this run; when its push failed, the snapshot holds lines main did not get.
      #   site     site/ as deployed, without data/notams/ (lane notams). Only when a Pages deploy succeeded.
      #   notams   site/data/notams/, the NOTAM subsets as published: at most one snapshot in 6 hours (about 2.5 MB
      #            compressed each). They are built every run from the NMS records that lane nms keeps.
      # Nothing is restored from the archive into this run, and the step changes nothing in the work tree. Each lane
      # is tried even if another failed; a missing token or any failed lane turns the run red after the deploy.
      - name: Private archive (NMS days, data, history and site, to tic-archive)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          COLLECTED: ${{ steps.collect.outcome }}
          HISTORY: ${{ steps.history.outcome }}
          HISTORY_FAILED: ${{ steps.history.outputs.failed }}
          DEPLOYED: ${{ steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so the NMS days, data/, data/history/ and site/ did not reach the private archive"; exit 1
          fi
          failed=0
          today=$(date -u +%Y-%m-%d)
          closed=0
          for f in cache/nms/archive/days/*.jsonl.gz; do
            if [ -f "$f" ] && [ "$(basename "$f" .jsonl.gz)" \< "$today" ]; then closed=$((closed + 1)); fi
          done
          if [ "$closed" -gt 0 ]; then
            python tools/tic_archive.py put --program cordon --lane nms --src cache/nms/archive/days \
              --exclude "$today.jsonl.gz" || failed=1
          else
            echo "nms: no closed NMS archive day in the cache this run, so none was archived"
          fi
          if [ "$COLLECTED" = "success" ]; then
            python tools/tic_archive.py put --program cordon --lane data --src data --exclude 'history/*' || failed=1
          else
            echo "data: collect did not finish this run, so data/ was not archived"
          fi
          if [ "$HISTORY" = "success" ] && [ "$HISTORY_FAILED" != "yes" ]; then
            python tools/tic_archive.py put --program cordon --lane history --src data/history || failed=1
          else
            echo "history: the History step did not log this run, so data/history/ was not archived"
          fi
          if [ "$DEPLOYED" = "true" ]; then
            python tools/tic_archive.py put --program cordon --lane site --src site --exclude 'data/notams/*' || failed=1
            if [ -d site/data/notams ]; then
              python tools/tic_archive.py put --program cordon --lane notams --src site/data/notams \
                --min-interval-hours 6 || failed=1
            else
              echo "notams: no NOTAM subsets in site/ this run"
            fi
          else
            echo "site: not deployed this run, so site/ was not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
      # After the deploy (audit C2): a failed history step or an unpushed commit fails the run, so it is seen, while
      # the site was still deployed and the data kept as the unpushed-data artifact.
      - name: Fail the run when history or a push failed
        if: always() && (steps.history.outputs.failed == 'yes' || steps.history.outputs.unpushed == 'yes' || steps.commit.outputs.unpushed == 'yes')
        run: |
          echo "::error::history failed: ${{ steps.history.outputs.failed == 'yes' }}; data push failed: ${{ steps.commit.outputs.unpushed == 'yes' }}; history push failed: ${{ steps.history.outputs.unpushed == 'yes' }}. The site was still deployed; see the unpushed-data artifact."
          exit 1
